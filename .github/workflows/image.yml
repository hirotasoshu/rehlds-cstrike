name: Build and publish image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          platforms: linux/amd64
      - name: Smoke test server startup
        run: |
          docker run -d --name cs16-smoke ghcr.io/${{ github.repository }}:${{ github.sha }} +maxplayers 8 +log on
          sleep 12
          docker logs cs16-smoke 2>&1 | tee /tmp/cs16-smoke.log
          docker ps --filter name=cs16-smoke --filter status=running --quiet | grep -q .
          grep -q 'Started map "de_dust2"' /tmp/cs16-smoke.log
          grep -q "Loaded plugin 'Reunion'" /tmp/cs16-smoke.log
          ! grep -E 'Invalid AuthVersion|ERROR: dll: Failed to load plugin' /tmp/cs16-smoke.log
          docker rm -f cs16-smoke
      - name: Push verified image
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest
